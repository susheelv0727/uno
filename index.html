<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Uno Night</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='10' y='6' width='44' height='52' rx='7' fill='%231c1c1c' stroke='%23fff' stroke-width='4'/%3E%3Cellipse cx='32' cy='32' rx='15' ry='20' fill='%23e53935' transform='rotate(-25 32 32)'/%3E%3Ctext x='32' y='39' font-size='22' font-family='Arial Black,Arial,sans-serif' font-weight='900' font-style='italic' fill='%23fdd835' text-anchor='middle'%3EU%3C/text%3E%3C/svg%3E">
<style>
:root{
  --r:#e53935; --y:#fdd835; --g:#43a047; --b:#1e88e5;
  --bg1:#0f4a37; --bg2:#06231a; --panel:rgba(0,0,0,.35); --text:#f4f7f5;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg2);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{background:radial-gradient(ellipse at 50% 30%,var(--bg1),var(--bg2) 70%);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0}
input{font:inherit}
.screen{display:none;height:100dvh;flex-direction:column}
.screen.on{display:flex}

/* buttons / inputs */
.btn{background:#fff;color:#111;font-weight:700;padding:12px 20px;border-radius:12px;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.btn.primary{background:var(--y);color:#222}
.btn.ghost{background:rgba(255,255,255,.12);color:#fff;box-shadow:none}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.sm{padding:6px 12px;font-size:14px;border-radius:9px}
.field{width:100%;padding:13px 14px;border-radius:12px;border:2px solid rgba(255,255,255,.2);background:rgba(0,0,0,.3);color:#fff;outline:0}
.field:focus{border-color:var(--y)}

/* home + lobby */
.center{margin:auto;width:min(420px,92vw);display:flex;flex-direction:column;gap:14px;padding:20px 0}
h1{margin:0;font-size:44px;text-align:center;letter-spacing:-1px}
h1 span{color:var(--y)}
.sub{text-align:center;opacity:.7;margin-top:-8px}
.row{display:flex;gap:10px}
.or{text-align:center;opacity:.6;font-size:13px}
.panel{background:var(--panel);border-radius:16px;padding:14px}
.code{font-size:52px;font-weight:900;letter-spacing:10px;text-align:center;color:var(--y);padding-left:10px}
.plist{display:flex;flex-direction:column;gap:8px}
.pitem{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.08);padding:10px 12px;border-radius:10px}
.pitem .nm{flex:1;font-weight:600}
.pitem.off{opacity:.45}
.av,.avimg{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:rgba(255,255,255,.15);font-size:20px;flex:none;overflow:hidden}
.avimg{object-fit:cover}
.av.sm,.avimg.sm{width:24px;height:24px;font-size:14px}
.av.lg,.avimg.lg{width:48px;height:48px;font-size:28px}
.tring{--p:1;--tcol:#fdd835;width:40px;height:40px;border-radius:50%;padding:3px;display:inline-flex;align-items:center;justify-content:center;flex:none;background:rgba(255,255,255,.12)}
.tring.on{background:conic-gradient(var(--tcol) calc(var(--p)*1turn), rgba(255,255,255,.18) 0);box-shadow:0 0 10px rgba(253,216,53,.35)}
.tring.sm{width:30px;height:30px;padding:3px}
.tring .av,.tring .avimg{width:100%;height:100%;font-size:18px;background:#16342a}
.tring.sm .av,.tring.sm .avimg{font-size:13px}
.tring.on .av,.tring.on .avimg{background:#143028}
.avbtn{width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,.12);font-size:28px;display:flex;align-items:center;justify-content:center;padding:0;box-shadow:none}
.avbtn span,.avbtn img{width:100%;height:100%;border-radius:14px;display:flex;align-items:center;justify-content:center;object-fit:cover}
.avpanel{padding:10px}
.avgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.avopt{background:rgba(255,255,255,.1);border-radius:10px;height:38px;font-size:22px;display:flex;align-items:center;justify-content:center}
.avopt.on{outline:2px solid var(--y);background:rgba(255,255,255,.18)}
.tag{font-size:11px;background:var(--y);color:#222;padding:2px 7px;border-radius:99px;font-weight:700}
.x{background:rgba(255,255,255,.12);border-radius:8px;width:28px;height:28px;line-height:1}
label.chk{display:flex;align-items:center;gap:10px;font-size:15px}
label.chk input{width:20px;height:20px;accent-color:var(--y)}

/* cards */
.card{--cw:64px;position:relative;width:var(--cw);height:calc(var(--cw)*1.5);border-radius:calc(var(--cw)*.14);border:calc(var(--cw)*.045) solid #fff;flex:none;
  box-shadow:0 2px 6px rgba(0,0,0,.45);user-select:none;overflow:hidden;color:var(--cc)}
.card.c-r{background:var(--r);--cc:#c62828}
.card.c-y{background:var(--y);--cc:#d49a00}
.card.c-g{background:var(--g);--cc:#2e7d32}
.card.c-b{background:var(--b);--cc:#1565c0}
.card.c-w{background:#1c1c1c;--cc:#fff}
.card::before{content:'';position:absolute;left:12%;right:12%;top:14%;bottom:14%;background:#fff;border-radius:50%;transform:rotate(-28deg)}
.card.c-w::before{background:conic-gradient(var(--r) 0 25%,var(--b) 0 50%,var(--g) 0 75%,var(--y) 0)}
.card .sym{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:calc(var(--cw)*.46);font-style:normal}
.card.c-w .sym{color:#fff;text-shadow:0 0 4px #000,0 0 2px #000}
.card .cor{position:absolute;left:calc(var(--cw)*.08);top:calc(var(--cw)*.04);font-size:calc(var(--cw)*.2);font-weight:800;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.card .cor.br{left:auto;top:auto;right:calc(var(--cw)*.08);bottom:calc(var(--cw)*.04);transform:rotate(180deg)}
.card.back{background:#222;border-color:#fff}
.card.back::before{background:var(--r);transform:rotate(-28deg)}
.card.back .sym{color:#fff;font-size:calc(var(--cw)*.3);text-shadow:0 1px 2px #000}
.card.big{--cw:92px}
.card.mini{--cw:22px;border-width:1px;border-radius:4px;margin-left:-14px}
.card.mini:first-child{margin-left:0}
.card.mini::before{display:none}
.card.mini .sym{display:none}

/* game */
#game{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.top{display:flex;align-items:center;gap:8px;padding:8px 10px}
.top .chip{background:var(--panel);padding:5px 10px;border-radius:99px;font-size:13px;font-weight:700}
.top .sp{flex:1}
.top .ib{background:var(--panel);width:38px;height:38px;border-radius:50%;font-size:17px;position:relative}
.badge{position:absolute;top:-3px;right:-3px;background:var(--r);color:#fff;border-radius:99px;font-size:11px;min-width:17px;height:17px;line-height:17px;font-weight:700}
#opps{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:4px 10px}
.opp{background:var(--panel);border:2px solid transparent;border-radius:12px;padding:6px 10px;min-width:92px;text-align:center;position:relative}
.opp.turn{border-color:var(--y);box-shadow:0 0 14px rgba(253,216,53,.5)}
.opp.off{opacity:.45}
.opp .oh{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:2px}
.opp .on{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:90px}
.opp .oc{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:4px;height:34px}
.opp .oc b{font-size:18px}
.opp .ow{font-size:11px;opacity:.8}
.opp .x{position:absolute;top:-8px;right:-8px;width:22px;height:22px;font-size:12px;background:var(--r)}
#table{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:0}
.piles{display:flex;gap:26px;align-items:center}
.pile{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;opacity:1}
.pile .lbl{opacity:.7}
#drawpile.can{animation:pulse 1s infinite;cursor:pointer}
@keyframes pulse{50%{transform:scale(1.06);filter:brightness(1.2)}}
.ring{padding:7px;border-radius:20px;background:var(--rc,#555);box-shadow:0 0 24px var(--rc,#555)}
.dirx{font-size:26px;opacity:.7}
#status{font-weight:700;font-size:16px;text-align:center;padding:0 14px;min-height:22px}
#status.me{color:var(--y)}
#log3{font-size:12px;opacity:.7;text-align:center;min-height:48px;padding:0 14px}
#actions{display:flex;gap:10px;justify-content:center;min-height:46px;padding:4px 10px;flex-wrap:wrap}
.uno{
  width:112px;height:112px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #ff7b7b 0%, #e53935 45%, #b71c1c 75%, #7f0000 100%);
  color:#fff;font-size:28px;font-weight:900;letter-spacing:1px;
  border:6px solid #4e0000;
  box-shadow:0 10px 0 #3b0000, 0 16px 22px rgba(0,0,0,.45), inset 0 6px 12px rgba(255,255,255,.35), inset 0 -8px 14px rgba(0,0,0,.2);
  display:inline-flex;align-items:center;justify-content:center;
  text-shadow:0 2px 4px rgba(0,0,0,.55);
  padding:0;line-height:1;
  transition:transform .06s, box-shadow .06s, filter .1s;
  animation:buzzPulse 1s infinite;
}
.uno:hover{filter:brightness(1.06)}
.uno:active{
  transform:translateY(8px) scale(.98);
  box-shadow:0 2px 0 #3b0000, 0 6px 12px rgba(0,0,0,.4), inset 0 4px 8px rgba(255,255,255,.2), inset 0 -4px 10px rgba(0,0,0,.25);
  animation:none;
}
@keyframes buzzPulse{50%{transform:scale(1.04);box-shadow:0 10px 0 #3b0000, 0 18px 28px rgba(229,57,53,.35), 0 16px 22px rgba(0,0,0,.45), inset 0 6px 12px rgba(255,255,255,.35), inset 0 -8px 14px rgba(0,0,0,.2)}}
#hand{display:flex;justify-content:flex-start;overflow-x:auto;overflow-y:visible;padding:30px 14px 28px;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
#hand::-webkit-scrollbar{display:none}
#hand .card{--rot:0deg;--ty:0px;--lift:0px;--sc:1;margin-left:calc(var(--cw)*var(--ol, -0.32));transition:transform .14s ease, box-shadow .12s, filter .12s;cursor:default;transform:translateY(calc(var(--ty) + var(--lift))) rotate(var(--rot)) scale(var(--sc));transform-origin:bottom center}
#hand .card:first-child{margin-left:0}
#hand .card:hover{--lift:-14px;--sc:1.04;z-index:5;filter:brightness(1.05)}
#hand .card.ok{--lift:-18px;box-shadow:0 0 0 3px #fff,0 0 14px 3px rgba(255,255,255,.7);cursor:pointer;z-index:2}
#hand .card.ok:hover{--lift:-24px;--sc:1.05;z-index:6}
#hand .card.no{filter:brightness(.55)}
#hand .card.no:hover{--lift:-8px;filter:brightness(.7);z-index:4}
#hand.mine{background:linear-gradient(transparent,rgba(253,216,53,.14))}
.hl{text-align:center;font-size:12px;opacity:.7;margin-top:-4px;padding-bottom:6px}
.hlrow{display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;opacity:.9;margin-top:-4px;padding-bottom:6px}

/* overlays */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal.on{display:flex}
.box{background:#16342a;border-radius:18px;padding:20px;width:min(380px,100%);display:flex;flex-direction:column;gap:12px;text-align:center}
.cpick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cpick button{height:72px;border-radius:16px;border:3px solid #fff}
.score{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:rgba(255,255,255,.08);border-radius:8px;gap:8px}
.score .sl{display:flex;align-items:center;gap:8px;min-width:0}
.score .sl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#chat{position:fixed;left:0;right:0;bottom:0;top:30%;background:#10281f;border-radius:18px 18px 0 0;z-index:15;display:none;flex-direction:column;box-shadow:0 -6px 30px rgba(0,0,0,.6)}
#chat.on{display:flex}
#chat header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;font-weight:700}
#msgs{flex:1;overflow-y:auto;padding:0 16px;display:flex;flex-direction:column;gap:6px;font-size:14px}
#msgs .s{opacity:.55;font-size:13px}
#msgs .c b{color:var(--y)}
#chat form{display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
#toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-80px);background:#fff;color:#111;font-weight:600;padding:10px 16px;border-radius:99px;z-index:50;transition:transform .25s;max-width:90vw;text-align:center}
#toast.on{transform:translate(-50%,0)}
@media (min-width:700px){#hand .card{--cw:84px}.card.big{--cw:112px}}
@media (max-height:640px){#hand .card{--cw:54px}.card.big{--cw:76px}#log3{display:none}}
</style>
</head>
<body>

<!-- HOME -->
<section id="home" class="screen on">
  <div class="center">
    <h1>Uno <span>Night</span></h1>
    <div class="sub">Card game for you and your friends</div>
    <div class="row" style="align-items:center">
      <button id="avpick" class="avbtn" type="button" title="Choose avatar"><span id="avcur">🙂</span></button>
      <input id="name" class="field" maxlength="14" placeholder="Your name" autocomplete="off" style="flex:1">
    </div>
    <div id="avpanel" class="panel avpanel" style="display:none">
      <div class="avgrid" id="avgrid"></div>
      <div class="row" style="margin-top:8px">
        <label class="btn ghost sm" style="flex:1;text-align:center;cursor:pointer">Upload image<input id="avfile" type="file" accept="image/*" style="display:none"></label>
        <button id="avclose" class="btn ghost sm" type="button">Done</button>
      </div>
    </div>
    <button id="create" class="btn primary">Create a room</button>
    <div class="or">— or join a friend's room —</div>
    <div class="row">
      <input id="code" class="field" maxlength="4" placeholder="CODE" autocapitalize="characters" autocomplete="off" style="text-transform:uppercase;letter-spacing:6px;text-align:center;font-weight:800">
      <button id="join" class="btn">Join</button>
    </div>
  </div>
</section>

<!-- LOBBY -->
<section id="lobby" class="screen">
  <div class="center">
    <div class="sub" style="margin:0">Room code</div>
    <div class="code" id="lcode"></div>
    <div class="row">
      <button id="copy" class="btn ghost" style="flex:1">Copy invite link</button>
      <button id="share" class="btn ghost" style="flex:1">Share</button>
    </div>
    <div class="panel plist" id="lplayers"></div>
    <div class="panel">
      <label class="chk"><input type="checkbox" id="stack"> Stack +2 / +4 cards</label>
    </div>
    <button id="start" class="btn primary">Start game</button>
    <div id="wait" class="sub" style="display:none">Waiting for the host to start…</div>
    <button id="lleave" class="btn ghost">Leave room</button>
  </div>
</section>

<!-- GAME -->
<section id="game" class="screen">
  <div class="top">
    <div class="chip" id="tcode"></div>
    <div class="chip" id="tdeck"></div>
    <div class="sp"></div>
    <button class="ib" id="musicbtn" title="Music">🔊</button>
    <button class="ib" id="chatbtn" title="Chat">💬<span class="badge" id="badge" style="display:none"></span></button>
    <button class="ib" id="gleave" title="Leave">✕</button>
  </div>
  <div id="opps"></div>
  <div id="table">
    <div class="piles">
      <div class="pile"><div id="drawpile" class="card big back"><i class="sym">★</i></div><span class="lbl">Draw</span></div>
      <div class="dirx" id="dirx">↻</div>
      <div class="pile"><div class="ring" id="ring"><div id="discard"></div></div><span class="lbl" id="colname"></span></div>
    </div>
    <div id="status"></div>
    <div id="log3"></div>
  </div>
  <div id="actions"></div>
  <div class="hl" id="hl"></div>
  <div id="hand"></div>
</section>

<!-- overlays -->
<div id="picker" class="modal"><div class="box"><b>Choose a color</b><div class="cpick">
  <button data-c="r" style="background:var(--r)"></button><button data-c="y" style="background:var(--y)"></button>
  <button data-c="g" style="background:var(--g)"></button><button data-c="b" style="background:var(--b)"></button>
</div></div></div>

<div id="over" class="modal"><div class="box">
  <div style="font-size:40px">🎉</div>
  <b id="owin" style="font-size:22px"></b>
  <div id="oscores" style="display:flex;flex-direction:column;gap:6px"></div>
  <button id="again" class="btn primary">Play again</button>
  <div id="owait" class="sub" style="display:none;margin:0">Waiting for the host…</div>
  <button id="oleave" class="btn ghost">Leave room</button>
</div></div>

<div id="chat">
  <header><span>Chat &amp; log</span><button class="x" id="chatx">✕</button></header>
  <div id="msgs"></div>
  <form id="chatform"><input id="chatin" class="field" maxlength="200" placeholder="Say something…" autocomplete="off"><button class="btn">Send</button></form>
</div>
<div id="toast"></div>

<script>
'use strict';
const $ = (s) => document.querySelector(s);
const h = (tag, props = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null) e.append(k);
  return e;
};
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} },
};

// identity
let pid = store.get('uno_pid');
if (!pid) {
  const a = new Uint8Array(16); crypto.getRandomValues(a);
  pid = Array.from(a, (x) => x.toString(16).padStart(2, '0')).join('');
  store.set('uno_pid', pid);
}

const AV_PRESETS = ['🙂','😎','🤖','🐱','🐶','🦊','🐼','🐸','🦄','👻','🔥','⭐','🍕','🎮','🚀','🌈'];
let myAvatar = store.get('uno_avatar') || '🙂';
function avatarNode(av, cls = '') {
  const a = av || '🙂';
  if (typeof a === 'string' && a.startsWith('data:image/')) return h('img', { class: 'avimg ' + cls, src: a, alt: '' });
  return h('span', { class: 'av ' + cls, text: a });
}
function setAvatar(av) {
  myAvatar = av || '🙂';
  store.set('uno_avatar', myAvatar);
  const cur = $('#avcur');
  if (cur) cur.replaceChildren(avatarNode(myAvatar));
  for (const b of document.querySelectorAll('.avopt')) b.classList.toggle('on', b.dataset.av === myAvatar);
}
function renderAvatarPicker() {
  const g = $('#avgrid'); if (!g) return;
  g.replaceChildren(...AV_PRESETS.map((a) => h('button', {
    class: 'avopt'+ (a === myAvatar ? ' on' : ''), type: 'button', text: a, 'data-av': a,
    onclick: () => setAvatar(a),
  })));
}
$('#avpick').onclick = () => { const p = $('#avpanel'); p.style.display = p.style.display === 'none' ? '' : 'none'; renderAvatarPicker(); };
$('#avclose').onclick = () => { $('#avpanel').style.display = 'none'; };
$('#avfile').onchange = (e) => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  const img = new Image();
  const url = URL.createObjectURL(f);
  img.onload = () => {
    try {
      const c = document.createElement('canvas'); const s = 64;
      c.width = s; c.height = s;
      const ctx = c.getContext('2d');
      const m = Math.min(img.width, img.height);
      ctx.drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, s, s);
      setAvatar(c.toDataURL('image/jpeg', 0.82));
    } finally { URL.revokeObjectURL(url); }
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast('Could not load image'); };
  img.src = url;
  e.target.value = '';
};
setAvatar(myAvatar);
$('#name').value = store.get('uno_name') || '';
const urlRoom = (new URLSearchParams(location.search).get('room') || '').toUpperCase();
if (urlRoom) $('#code').value = urlRoom;

let S = null, es = null, roomCode = null, prevTurn = null, seenLog = 0, chatOpen = false, prevLog = null, prevPhase = null;
let musicOn = store.get('uno_music') !== '0';
let audioCtx = null, musicMaster = null, musicInterval = null;

function ensureAudio() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    if (!audioCtx) audioCtx = new AC();
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    return audioCtx;
  } catch (e) { return null; }
}
function stopMusic() {
  if (musicInterval) { clearInterval(musicInterval); musicInterval = null; }
  if (musicMaster) { try { musicMaster.disconnect(); } catch (e) {} musicMaster = null; }
}
function startMusic() {
  if (!musicOn || musicInterval) return;
  const ctx = ensureAudio(); if (!ctx) return;
  try {
    musicMaster = ctx.createGain();
    musicMaster.gain.value = 0.045;
    musicMaster.connect(ctx.destination);
    const seq = [261.63, 329.63, 392.0, 523.25, 392.0, 329.63, 293.66, 349.23, 440.0, 587.33, 440.0, 349.23];
    let i = 0;
    musicInterval = setInterval(() => {
      if (!musicMaster || !audioCtx) return;
      const t = audioCtx.currentTime;
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'triangle';
      o.frequency.setValueAtTime(seq[i % seq.length], t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.12, t + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.42);
      o.connect(g); g.connect(musicMaster);
      o.start(t); o.stop(t + 0.45);
      if (i % 4 === 0) {
        const b = audioCtx.createOscillator();
        const bg = audioCtx.createGain();
        b.type = 'sine';
        b.frequency.setValueAtTime(seq[i % seq.length] / 2, t);
        bg.gain.setValueAtTime(0.0001, t);
        bg.gain.exponentialRampToValueAtTime(0.08, t + 0.04);
        bg.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
        b.connect(bg); bg.connect(musicMaster);
        b.start(t); b.stop(t + 0.95);
      }
      i++;
    }, 480);
  } catch (e) {}
}
function updateMusicBtn() {
  const b = $('#musicbtn');
  if (b) b.textContent = musicOn ? '🔊' : '🔇';
}
$('#musicbtn').onclick = () => {
  musicOn = !musicOn;
  store.set('uno_music', musicOn ? '1' : '0');
  updateMusicBtn();
  if (musicOn) { if (S && S.phase === 'playing') startMusic(); }
  else stopMusic();
};
updateMusicBtn();

function speakUno(text) {
  try {
    if (!('speechSynthesis' in window)) return;
    const name = String(text || '').replace(/:\s*UNO!$/, '').trim();
    const u = new SpeechSynthesisUtterance(name ? `${name} says UNO!` : 'UNO!');
    u.rate = 1.05; u.pitch = 1.1; u.volume = 1;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  } catch (e) {}
}
function maybeAnnounceUno() {
  if (!S) return;
  const cur = S.log || [];
  if (!prevLog) { prevLog = cur.slice(); return; }
  const last = prevLog[prevLog.length - 1];
  let idx = -1;
  if (last) {
    for (let i = cur.length - 1; i >= 0; i--) {
      const l = cur[i];
      if (l && l.k === last.k && l.text === last.text && (l.who || '') === (last.who || '')) { idx = i; break; }
    }
  }
  const fresh = idx >= 0 ? cur.slice(idx + 1) : (cur.length > prevLog.length ? cur.slice(prevLog.length) : []);
  for (const l of fresh) {
    if (l && l.k === 'sys' && /:\s*UNO!$/.test(l.text || '')) speakUno(l.text);
  }
  prevLog = cur.slice();
}

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2200);
}
async function api(path, body) {
  try {
    const r = await fetch(path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
    return await r.json();
  } catch (e) { return { ok: false, error: 'Connection problem' }; }
}
const act = async (type, extra = {}) => {
  const r = await api('/api/act', { room: roomCode, pid, type, ...extra });
  if (!r.ok) toast(r.error || 'Something went wrong');
  return r;
};
function show(id) { for (const s of document.querySelectorAll('.screen')) s.classList.toggle('on', s.id === id); }

// ---- connecting ----
async function enter(code) {
  const name = $('#name').value.trim();
  if (!name) { toast('Enter your name first'); $('#name').focus(); return; }
  store.set('uno_name', name);
  store.set('uno_avatar', myAvatar);
  const r = await api('/api/join', { pid, name, room: code || undefined, avatar: myAvatar });
  if (!r.ok) { toast(r.error); return; }
  connect(r.room);
}
function connect(code) {
  roomCode = code; store.set('uno_room', code);
  if (es) es.close();
  es = new EventSource(`/events?room=${code}&pid=${pid}`);
  es.onmessage = (e) => { S = JSON.parse(e.data); render(); };
  es.addEventListener('removed', () => goHome('You left the room'));
  es.onerror = async () => {
    if (es.readyState !== 2) return; // browser is retrying by itself
    const r = await api('/api/join', { pid, name: $('#name').value.trim() || store.get('uno_name') || 'Player', room: roomCode, avatar: myAvatar });
    if (r.ok) connect(roomCode); else goHome(r.error || 'Disconnected');
  };
}
function goHome(msg) {
  stopMusic();
  if (es) es.close(); es = null; S = null; roomCode = null; prevLog = null; prevPhase = null; store.set('uno_room', null);
  document.title = 'Uno Night';
  $('#over').classList.remove('on'); $('#chat').classList.remove('on'); chatOpen = false;
  history.replaceState(null, '', location.pathname);
  show('home'); if (msg) toast(msg);
}
async function leave() { if (roomCode) await act('leave'); goHome(); }

$('#create').onclick = () => enter(null);
$('#join').onclick = () => { const c = $('#code').value.trim().toUpperCase(); if (c.length !== 4) return toast('Enter the 4-letter code'); enter(c); };
$('#code').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#join').click(); });
$('#lleave').onclick = leave; $('#gleave').onclick = () => confirm('Leave this game?') && leave(); $('#oleave').onclick = leave;
$('#start').onclick = () => act('start'); $('#again').onclick = () => act('start');
$('#stack').onchange = (e) => act('opts', { stack: e.target.checked });
async function copyLink() {
  const link = location.origin + '/?room=' + S.code;
  try { await navigator.clipboard.writeText(link); toast('Invite link copied'); } catch (e) { prompt('Copy this link', link); }
}
$('#copy').onclick = copyLink;
$('#share').onclick = () => {
  const link = location.origin + '/?room=' + S.code;
  if (navigator.share) navigator.share({ title: 'Uno Night', text: `Join my game! Code: ${S.code}`, url: link }).catch(() => {});
  else copyLink();
};
$('#chatbtn').onclick = () => { chatOpen = true; $('#chat').classList.add('on'); seenLog = S ? S.log.length : 0; renderChat(); };
$('#chatx').onclick = () => { chatOpen = false; $('#chat').classList.remove('on'); };
$('#chatform').onsubmit = (e) => { e.preventDefault(); const t = $('#chatin').value.trim(); if (t) act('chat', { text: t }); $('#chatin').value = ''; };

// ---- cards ----
const SYM = { skip: '⊘', rev: '⇄', d2: '+2', d4: '+4', wild: '' };
const COLOR_NAME = { r: 'Red', y: 'Yellow', g: 'Green', b: 'Blue' };
const COLOR_VAR = { r: '#e53935', y: '#fdd835', g: '#43a047', b: '#1e88e5' };
function label(c) { return /^\d$/.test(c.v) ? c.v : SYM[c.v]; }
function cardEl(c, cls = '', onclick) {
  const l = label(c);
  const e = h('div', { class: `card c-${c.c} ${cls}` },
    h('span', { class: 'cor', text: l || '★' }), h('i', { class: 'sym', text: l }), h('span', { class: 'cor br', text: l || '★' }));
  if (onclick) e.addEventListener('click', onclick);
  return e;
}

function avatarNode(av, cls) {
  const c = cls ? ' ' + cls : '';
  if (typeof av === 'string' && av.startsWith('data:image/')) return h('img', { class: 'avimg' + c, src: av, alt: '' });
  return h('div', { class: 'av' + c, text: av || '🙂' });
}

function avatarTimerNode(av, cls, active) {
  const ring = h('div', { class: 'tring' + (cls ? ' ' + cls : '') + (active ? ' on' : '') }, avatarNode(av, ''));
  if (active) ring.dataset.timer = 'on';
  return ring;
}

let timerRAF = null;
function tickTimer() {
  if (timerRAF) { cancelAnimationFrame(timerRAF); timerRAF = null; }
  const run = () => {
    if (!S || S.phase !== 'playing' || !S.turnDeadline) {
      document.querySelectorAll('[data-timer="on"]').forEach((el) => { el.style.setProperty('--p', '1'); el.style.setProperty('--tcol', '#fdd835'); });
      timerRAF = null;
      return;
    }
    const dur = S.turnDuration || 10000;
    const p = Math.max(0, Math.min(1, (S.turnDeadline - Date.now()) / dur));
    const col = p < 0.3 ? '#e53935' : p < 0.6 ? '#fb8c00' : '#fdd835';
    document.querySelectorAll('[data-timer="on"]').forEach((el) => {
      el.style.setProperty('--p', String(p));
      el.style.setProperty('--tcol', col);
    });
    timerRAF = requestAnimationFrame(run);
  };
  timerRAF = requestAnimationFrame(run);
}

// auto-rejoin after a reload
(async () => {
  const saved = store.get('uno_room');
  if (saved && (!urlRoom || urlRoom === saved) && store.get('uno_name')) {
    const r = await api('/api/join', { pid, name: store.get('uno_name'), room: saved, avatar: myAvatar });
    if (r.ok) connect(r.room); else store.set('uno_room', null);
  }
})();

function render() {
  if (!S) return;
  document.title = `Uno Night - ${S.code}`;

  // update players panel
  const me = S.players.findIndex((p) => p.id === S.you), n = S.players.length;
  const opps = $('#opps'); opps.replaceChildren();
  for (let i = 1; i < n; i++) {
    const p = S.players[(me + i) % n];
    const backs = h('div', { class: 'oc' }, h('span', {}, ...Array.from({ length: Math.min(p.count, 6) }, () => h('div', { class: 'card back mini' }))), h('b', { text: p.count }));
    backs.firstChild.style.display = 'flex';
    const turnActive = p.id === S.turn && S.phase === 'playing';
    opps.append(h('div', { class: 'opp' + (p.id === S.turn ? ' turn' : '') + (p.connected ? '' : ' off') },
      h('div', { class: 'oh' }, avatarTimerNode(p.avatar, 'sm', turnActive), h('div', { class: 'on', text: p.name })),
      backs,
      p.wins ? h('div', { class: 'ow', text: '🏆 ' + p.wins }) : null,
      S.host === S.you && !p.connected ? h('button', { class: 'x', text: '✕', title: 'Remove', onclick: () => act('kick', { target: p.id }) }) : null));
  }

  // update room info
  $('#lcode').textContent = S.code;
  $('#tcode').textContent = S.code;
  $('#tdeck').textContent = S.deck ? `Deck: ${S.deck}` : '';
  $('#status').textContent = S.phase === 'playing' ? 'Your turn' : S.phase === 'waiting' ? 'Waiting for players' : '';
  $('#wait').style.display = S.phase === 'waiting' ? '' : 'none';

  // update hands
  const hand = $('#hand'); hand.replaceChildren();
  for (const c of S.hand) hand.append(cardEl(c, 'ok'));
  const mine = S.players.find((p) => p.id === S.you);
  if (mine && mine.hand) {
    const lbl = h('div', { class: 'hl' }, `Your hand (${mine.hand.length})`);
    if (S.phase === 'playing' && S.turn === S.you) lbl.classList.add('blink');
    hand.prepend(lbl);
  }

  // update turn timer
  document.querySelectorAll('[data-timer="on"]').forEach((el) => { el.style.setProperty('--p', '1'); el.style.setProperty('--tcol', '#fdd835'); });
  if (S.phase === 'playing' && S.turnDeadline) {
    const dur = S.turnDuration || 10000;
    const p = Math.max(0, Math.min(1, (S.turnDeadline - Date.now()) / dur));
    const col = p < 0.3 ? '#e53935' : p < 0.6 ? '#fb8c00' : '#fdd835';
    document.querySelectorAll('[data-timer="on"]').forEach((el) => {
      el.style.setProperty('--p', String(p));
      el.style.setProperty('--tcol', col);
    });
  }

  // update chat log
  if (chatOpen) { seenLog = S.log.length; renderChat(); }
  maybeAnnounceUno();

  const meP = S.players[me];
  const hl = $('#hl');
  hl.className = 'hlrow';
  hl.replaceChildren(
    avatarTimerNode(meP ? meP.avatar : myAvatar, 'sm', myTurn),
    h('span', { text: `${meP ? meP.name : 'You'} · ${S.hand.length} card${S.hand.length === 1 ? '' : 's'}` + (meP && meP.wins ? ` · 🏆 ${meP.wins}` : '') })
  );

  // round over overlay
  if (S.phase === 'over') {
    const winner = S.players.find((p) => p.id === S.winner);
    const youWon = S.winner === S.you;
    $('#oresult').textContent = youWon ? 'You won!' : `${winner ? winner.name : 'Someone'} won!`;
    $('#osub').textContent = youWon ? 'Nice play.' : 'Better luck next round.';
    const sb = $('#oscores'); sb.replaceChildren();
    for (const p of S.players) sb.append(h('div', { class: 'score' },
      h('div', { class: 'sl' }, avatarNode(p.avatar, 'sm'), h('span', { text: p.name + (p.id === S.you ? ' (you)' : '') })),
      h('span', { text: `🏆 ${p.wins}` })));
    $('#again').style.display = S.host === S.you ? '' : 'none';
    $('#owait').style.display = S.host === S.you ? 'none' : '';
    $('#over').classList.add('on');
  } else $('#over').classList.remove('on');

  tickTimer();
}

// ---- render ----
function render() {
  if (!S) return;
  maybeAnnounceUno();
  if (S.phase === 'playing' && prevPhase !== 'playing') startMusic();
  if (S.phase !== 'playing' && prevPhase === 'playing') stopMusic();
  prevPhase = S.phase;
  if (S.phase === 'lobby') { show('lobby'); renderLobby(); $('#over').classList.remove('on'); }
  else { show('game'); renderGame(); }
  renderChat(true);
  tickTimer();
}
</script>
